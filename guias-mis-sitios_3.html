<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passporter — Guías · Mis Sitios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --pr:#007a51;--n50:#eef0f1;--n100:#e6e8ea;--n200:#dde0e3;
  --n400:#bcc1c8;--n500:#abb2ba;--n700:#72777d;--n800:#55595f;
  --tp:#2a2d31;--ts:#55595f;--tt:#72777d;
  --bgs:#f8f9fa;--bgm:#eef0f1;--bgi:#1b352c;
  --bs:#e6e8ea;--bd:#dde0e3;
  --sh:0 1px 3px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.06);
  --shm:0 4px 8px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --rmd:8px;--rlg:12px;--rfull:9999px;
  --f:"Cerebri Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--f);background:#fff;display:flex;}

/* ─── SIDEBAR ─── */
.snav{width:64px;flex-shrink:0;background:var(--bgs);display:flex;flex-direction:column;align-items:center;height:100vh;}
.szone{width:64px;border-top:1px solid var(--n50);border-left:1px solid var(--n50);border-right:1px solid var(--n50);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;flex-shrink:0;}
.szone.grow{flex:1;}
.szone.slim{padding:6px 14px;}
.slogo-wrap{display:flex;align-items:center;gap:2px;padding:4px;}
.slogo-wrap img{width:16px;height:16px;}
.scaret svg{width:10px;height:10px;fill:none;stroke:var(--n500);stroke-width:2;stroke-linecap:round;}
.snav-inner{display:flex;flex-direction:column;gap:14px;width:36px;}
.snav-group{display:flex;flex-direction:column;gap:2px;}
.sdiv{width:36px;height:1px;background:var(--n200);border-radius:80px;}
.si{width:36px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tt);transition:background .15s;flex-shrink:0;}
.si:hover{background:var(--n100);}
.si.active{background:var(--n100);color:var(--tp);}
.si svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* ─── APP ─── */
.app{display:flex;flex:1;height:100vh;overflow:hidden;}

/* ─── LEFT PANEL (posición relativa para que el detalle se superponga) ─── */
.lp{width:447px;flex-shrink:0;border-right:1px solid var(--bs);display:flex;flex-direction:column;overflow:hidden;background:#fff;position:relative;}
.lph{padding:20px 16px 0;flex-shrink:0;}
.ptitle{font-size:24px;font-weight:700;color:#021f15;line-height:40px;}

/* ─── TABS ─── */
.tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 16px;flex-shrink:0;}
.tab{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px;color:var(--tp);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s;font-family:var(--f);}
.tab.active{border-bottom-color:var(--tp);font-weight:600;}
.tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ─── FILTERS ─── */
.filters{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fp{display:flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--bd);border-radius:var(--rfull);font-size:13px;white-space:nowrap;cursor:pointer;background:#fff;color:var(--tp);transition:all .15s;flex-shrink:0;font-family:var(--f);}
.fp.active{background:var(--pr);color:#fff;border-color:var(--pr);}
.fp:hover:not(.active){border-color:var(--n500);}
.fp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* ─── GUIDES LIST ─── */
.gl{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;}
.gl::-webkit-scrollbar{width:4px;}
.gl::-webkit-scrollbar-thumb{background:var(--n200);border-radius:4px;}

/* ─── GUIDE CARD ─── */
.gc{background:#fff;border-radius:var(--rmd);border:1px solid var(--bs);cursor:pointer;display:flex;align-items:stretch;overflow:hidden;transition:all .15s;flex-shrink:0;}
.gc:hover{border-color:var(--bd);box-shadow:var(--sh);}
.gc.active{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr);}
.gcimg{width:130px;min-width:130px;height:120px;flex-shrink:0;overflow:hidden;}
.gcimg img{width:130px;height:120px;object-fit:cover;display:block;}
.gcb{flex:1;padding:10px 6px 10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
.gctop{display:flex;flex-direction:column;gap:3px;}
.gcbadge{display:inline-flex;align-items:center;background:var(--bgm);color:var(--tp);font-size:11px;font-weight:600;padding:1px 10px;border-radius:var(--rfull);width:fit-content;white-space:nowrap;}
.gctitle{font-size:14px;font-weight:600;color:var(--tp);line-height:20px;}
.gcdesc{font-size:13px;color:var(--ts);line-height:19px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.gcmeta{font-size:12px;font-weight:600;color:var(--ts);}
.gcarr{display:flex;align-items:center;padding-right:8px;color:var(--n500);flex-shrink:0;}
.gcarr svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ─── DETAIL PANEL (superpuesto encima del left panel) ─── */
/* Posición absoluta, ocupa todo el .lp */
.dp{
  position:absolute;
  inset:0;
  background:var(--bgs);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:10;
  border-right:1px solid var(--bs);
}
.dp.open{display:flex;}

/* scroll del detalle — padding 12px 16px, gap 12px entre secciones */
.dscroll{
  flex:1;overflow-y:auto;
  padding:12px 16px;
  display:flex;flex-direction:column;gap:12px;
  scrollbar-width:thin;scrollbar-color:var(--n200) transparent;
}
.dscroll::-webkit-scrollbar{width:4px;}
.dscroll::-webkit-scrollbar-thumb{background:var(--n200);border-radius:4px;}

/* back row — sticky header del panel detalle */
.dbk{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;font-size:14px;font-weight:600;
  color:var(--ts);letter-spacing:.01em;
  transition:color .15s;
  flex-shrink:0;
  padding:12px 16px;
  background:var(--bgs);
  border-bottom:1px solid var(--bs);
  position:sticky;top:0;z-index:2;
}
.dbk:hover{color:var(--pr);}
.dbk svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* hero image */
.dhero{border-radius:var(--rlg);overflow:hidden;height:137px;flex-shrink:0;}
.dhero img{width:100%;height:137px;object-fit:cover;display:block;}

/* info block */
.dinfo{display:flex;flex-direction:column;gap:6px;}
.dbadge{display:inline-flex;background:var(--bgm);color:var(--tp);font-size:11px;font-weight:600;padding:1px 10px;border-radius:var(--rfull);width:fit-content;}
.dtitle{font-size:18px;font-weight:700;color:var(--tp);line-height:29px;letter-spacing:-.02em;}
.ddesc{font-size:14px;color:var(--ts);line-height:22px;}
.dmeta{font-size:12px;font-weight:600;color:var(--ts);letter-spacing:.01em;}

/* CTA guardar */
.dcta{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:#fff;color:#1b352c;border:1px solid #dce1df;border-radius:var(--rmd);padding:0 16px;height:40px;font-size:14px;font-weight:700;font-family:var(--f);cursor:pointer;letter-spacing:-.017em;width:fit-content;transition:background .15s;}
.dcta:hover{background:#f0f5f3;}
.dcta.saved{background:#e6f3ef;border-color:var(--pr);color:var(--pr);}

/* section title */
.slabel{font-size:16px;font-weight:500;color:#000;line-height:26px;}

/* ─── SPOT ITEMS (fiel al Figma: imagen con bm superpuesto, nombre, cat, SIN tag) ─── */
.spots-list{display:flex;flex-direction:column;gap:12px;}

.sitem{
  background:#fff;border:1px solid var(--n200);border-radius:var(--rmd);
  display:flex;align-items:center;gap:6px;padding:12px;cursor:pointer;
  transition:box-shadow .12s;
}
.sitem:hover{box-shadow:var(--sh);}

/* Imagen 90×90 con bookmark 30×30 superpuesto arriba-izquierda (padding 6px) */
.sthumb{
  width:90px;height:90px;border-radius:6px;overflow:hidden;
  flex-shrink:0;position:relative;
}
.sthumb img{width:90px;height:90px;object-fit:cover;display:block;}
.sthumb-bm{
  position:absolute;top:6px;left:6px;
  width:30px;height:30px;border-radius:var(--rmd);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s;
  z-index:2;
}
.sthumb-bm:hover{background:#f0f5f3;}
.sthumb-bm svg{width:20px;height:20px;fill:none;stroke:var(--tp);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.sthumb-bm.saved svg{fill:var(--pr);stroke:var(--pr);}

/* Body: nombre + fila cat. Sin tag. */
.sbody{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;justify-content:center;}
.sname{font-size:14px;font-weight:600;color:#2a2d31;line-height:22px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scat{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ts);line-height:22px;}
.scat svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* ─── EMPTY ─── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:12px;text-align:center;color:var(--tt);flex:1;}
.empty svg{width:40px;height:40px;stroke:#cdd1d6;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.empty p{font-size:14px;line-height:20px;}

/* ─── RIGHT PANEL ─── */
.rp{flex:1;display:flex;overflow:hidden;}

/* ─── MAP ─── */
.mp{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}
.mfab{position:absolute;z-index:1000;top:16px;right:16px;width:40px;height:40px;background:#fff;border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);cursor:pointer;border:none;transition:background .15s;color:var(--tp);}
.mfab:hover{background:var(--bgs);}
.mfab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:var(--shm)!important;padding:0!important;}
.leaflet-popup-content{margin:0!important;width:auto!important;}
.leaflet-popup-tip-container{display:none!important;}
.mpop{padding:10px 14px;min-width:140px;font-family:var(--f);}
.mpop-n{font-size:13px;font-weight:600;color:var(--tp);}
.mpop-c{font-size:12px;color:var(--ts);margin-top:2px;}

/* ─── SPOT DETAIL PANEL (Aside, 419px, sobre el área del mapa) ─── */
.spot-aside{
  width:419px;flex-shrink:0;
  background:#fff;
  border-right:1px solid var(--n200);
  box-shadow:4px 0 24px rgba(0,0,0,0.04);
  display:none;flex-direction:column;
  overflow-y:auto;height:100%;
  scrollbar-width:thin;scrollbar-color:var(--n200) transparent;
  z-index:20;
}
.spot-aside.open{display:flex;}
.spot-aside::-webkit-scrollbar{width:4px;}
.spot-aside::-webkit-scrollbar-thumb{background:var(--n200);border-radius:4px;}

/* Cover: 242px, imagen con gradiente */
.sp-cover{
  height:242px;flex-shrink:0;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:12px;
}
.sp-cover img.sp-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
.sp-cover-gradient{
  position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 65%);
}
.sp-cover-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  position:relative;z-index:2;
}
.sp-cover-btn{
  width:32px;height:32px;background:#fff;border-radius:var(--rmd);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;transition:background .15s;flex-shrink:0;
}
.sp-cover-btn:hover{background:#f0f5f3;}
.sp-cover-btn.saved svg{fill:var(--pr);stroke:var(--pr);}
.sp-cover-btn svg{width:20px;height:20px;fill:none;stroke:var(--tp);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.sp-dots{
  display:flex;gap:7px;align-items:center;justify-content:center;
  position:relative;z-index:2;padding:3.5px;
}
.sp-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.45);}
.sp-dot.active{background:#fff;}

/* Body */
.sp-body{
  background:#fff;
  padding:16px;
  display:flex;flex-direction:column;gap:14px;
  flex:1;
}
.sp-title{font-size:20px;font-weight:700;color:#2a2d31;line-height:32px;letter-spacing:-.02em;}
.sp-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.sp-stars{display:flex;gap:1.5px;align-items:center;}
.sp-star{width:18px;height:18px;color:#fdd032;}
.sp-star svg{width:18px;height:18px;fill:currentColor;}
.sp-rating{font-size:14px;color:#1b352c;line-height:22px;margin-left:6px;}
.sp-dot-sep{color:#1b352c;font-weight:700;font-size:18px;line-height:12px;margin:0 2px;}
.sp-cat-row{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ts);}
.sp-cat-row svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* CTA "Como llegar" — full width, borde n200 */
.sp-cta{
  width:100%;height:40px;
  background:#fff;color:#2a2d31;
  border:1px solid var(--n200);border-radius:var(--rmd);
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:14px;font-weight:700;font-family:var(--f);
  cursor:pointer;letter-spacing:-.017em;
  transition:background .15s;
}
.sp-cta:hover{background:var(--bgs);}
.sp-cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* Descripción */
.sp-desc{font-size:14px;color:#2a2d31;line-height:22px;}
.sp-desc a{font-size:14px;font-weight:600;color:#2a2d31;text-decoration:underline;letter-spacing:.01em;display:block;margin-top:6px;}
.sp-desc a:hover{color:var(--pr);}

/* Info rows — icono 24×24 en fondo #f8f9fa */
.sp-info{display:flex;flex-direction:column;}
.sp-info-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:12px 0 13px;
  border-bottom:1px solid var(--n50);
}
.sp-info-row:last-child{border-bottom:none;}
.sp-info-icon{
  width:24px;height:24px;border-radius:6px;background:var(--bgs);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sp-info-icon svg{width:16px;height:16px;fill:none;stroke:var(--ts);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.sp-info-content{flex:1;display:flex;flex-direction:column;gap:4px;}
.sp-info-label{font-size:14px;font-weight:600;color:var(--ts);line-height:22px;letter-spacing:.01em;}
.sp-info-value{font-size:14px;color:#2a2d31;line-height:22px;}
.sp-info-link{font-size:14px;font-weight:600;color:#0060b2;text-decoration:underline;letter-spacing:.01em;}
.sp-schedule{display:flex;flex-direction:column;gap:4px;}
.sp-sched-row{display:flex;gap:4px;font-size:14px;line-height:22px;}
.sp-sched-day{font-weight:600;color:#2a2d31;width:80px;flex-shrink:0;letter-spacing:.01em;}
.sp-sched-time{color:#2a2d31;}

/* ─── TOAST ─── */
.toast-container{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.toast{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  background:#fff;
  border-radius:8px;
  box-shadow:0 8px 24px -4px rgba(0,0,0,.12),0 2px 6px -2px rgba(16,24,40,.06);
  min-width:260px;
  max-width:400px;
  pointer-events:auto;
  opacity:0;
  transform:translateY(12px);
  transition:opacity 220ms cubic-bezier(0.2,0,0,1), transform 220ms cubic-bezier(0.2,0,0,1);
  will-change:opacity,transform;
}
.toast.toast-show{
  opacity:1;
  transform:translateY(0);
}
.toast.toast-hide{
  opacity:0;
  transform:translateY(8px);
}
.toast-icon{
  width:24px;height:24px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.toast-icon.success{background:#59C09C;}
.toast-icon.error{background:#FF789A;}
.toast-msg{
  font-size:14px;color:#021F15;
  letter-spacing:-0.24px;
  flex:1;
  font-family:var(--f);
  line-height:20px;
}
.toast-close{
  color:#808F8A;cursor:pointer;
  font-size:18px;line-height:1;
  flex-shrink:0;background:none;border:none;
  padding:0 2px;
  font-family:sans-serif;
}
.toast-close:hover{color:var(--tp);}

</style>
</head>

      <div class="scaret"><svg viewBox="0 0 10 6"><polyline points="1 1 5 5 9 1"/></svg></div>

        <div class="si"><svg viewBox="0 0 16 16"><rect x="1" y="5" width="14" height="9" rx="1.2"/><path d="M5.5 5V3.5a1 1 0 011-1h3a1 1 0 011 1V5"/></svg></div>

      <div class="snav-group">
        <div class="si"><svg viewBox="0 0 16 16"><path d="M1.5 5.5a2 2 0 000 5V13a.5.5 0 00.5.5h12a.5.5 0 00.5-.5v-2.5a2 2 0 000-5V3a.5.5 0 00-.5-.5H2a.5.5 0 00-.5.5z"/><line x1="10" y1="3" x2="10" y2="13" stroke-dasharray="1.5 1.5"/></svg></div>
        <div class="si"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5C6.5 3.5 5.5 5.5 5.5 8s1 4.5 2.5 6.5M8 1.5C9.5 3.5 10.5 5.5 10.5 8s-1 4.5-2.5 6.5"/><line x1="1.5" y1="8" x2="14.5" y2="8"/><path d="M2.5 5h11M2.5 11h11"/></svg></div>
      </div>
    </div>
  </div>

<script>
/* ── TOAST ── */
function showToast(msg, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast';

  var iconSvg = type === 'success'
    ? '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m3 7 3 3 5-6" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 4l6 6M10 4l-6 6" stroke="#FFF" stroke-width="2" stroke-linecap="round"/></svg>';

  t.innerHTML =
    '<div class="toast-icon ' + type + '">' + iconSvg + '</div>' +
    '<div class="toast-msg">' + msg + '</div>' +
    '<button class="toast-close" aria-label="Cerrar">×</button>';

  container.appendChild(t);

  // Force reflow then animate in
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { t.classList.add('toast-show'); });
  });

  var tid;
  function dismiss() {
    clearTimeout(tid);
    t.classList.remove('toast-show');
    t.classList.add('toast-hide');
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
  }

  t.querySelector('.toast-close').addEventListener('click', dismiss);
  tid = setTimeout(dismiss, 3500);
}

var mapObj=null,markers=[],ag=null,activeTab="parati";

/* ── MAP ── */
function initMap(){
  mapObj=L.map("map",{center:[41.3851,2.1734],zoom:13,zoomControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'© <a href="https://www.openstreetmap.org/copyright">OSM</a>',maxZoom:19}).addTo(mapObj);
  L.control.zoom({position:"bottomright"}).addTo(mapObj);
  showAllPins();
}
function mkIco(c){return L.divIcon({html:"<div style='background:"+c+";width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.28);'></div>",className:"",iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-28]});}
function clearM(){markers.forEach(function(m){m.remove();});markers=[];}
function visibleGuides(){
  var f=(document.querySelector(".fp.active")||{dataset:{filter:"todos"}}).dataset.filter;
  return GUIDES.filter(function(g){return g.tab===activeTab&&(f==="todos"||g.cat===f);});
}
function showAllPins(){
  clearM();
  visibleGuides().forEach(function(g){
    var m=L.marker(g.c,{icon:mkIco(g.col)}).addTo(mapObj)
      .bindPopup("<div class='mpop'><div class='mpop-n'>"+g.title+"</div><div class='mpop-c'>"+g.count+"</div></div>",{closeButton:false});
    m.on("click",function(){openGuide(g.id);});
    markers.push(m);
  });
}
function showSpotPins(g){
  clearM();
  var bounds=[];
  g.spots.forEach(function(s){
    var m=L.marker([s.la,s.lo],{icon:mkIco(g.col)}).addTo(mapObj)
      .bindPopup("<div class='mpop'><div class='mpop-n'>"+s.n+"</div><div class='mpop-c'>"+s.t+"</div></div>",{closeButton:false});
    markers.push(m);bounds.push([s.la,s.lo]);
  });
  if(bounds.length) mapObj.fitBounds(bounds,{padding:[40,40],maxZoom:15});
}

/* ── LIST ── */
function renderList(){
  var list=document.getElementById("guidesList"),gs=visibleGuides();
  if(!gs.length){
    list.innerHTML="<div class='empty'>"+ICO_SCH+"<p>No hay guías para<br>esta categoría.</p></div>";
    return;
  }
  list.innerHTML=gs.map(function(g){
    return "<div class='gc"+(ag&&ag.id===g.id?" active":"")+"' data-id='"+g.id+"'>"+
      "<div class='gcimg'><img src='"+PH+"' alt=''/></div>"+
      "<div class='gcb'><div class='gctop'><span class='gcbadge'>"+g.badge+"</span><div class='gctitle'>"+g.title+"</div><div class='gcdesc'>"+g.desc+"</div></div><div class='gcmeta'>"+g.count+"</div></div>"+
      "<div class='gcarr'>"+ICO_CAR+"</div></div>";
  }).join("");
  list.querySelectorAll(".gc").forEach(function(c){c.addEventListener("click",function(){openGuide(parseInt(c.dataset.id));});});
}

/* ── DETAIL: se abre encima del left panel ── */
function openGuide(id){
  var g=GUIDES.filter(function(x){return x.id===id;})[0];if(!g)return;
  ag=g;
  document.querySelectorAll(".gc").forEach(function(c){c.classList.toggle("active",parseInt(c.dataset.id)===id);});

  /* Mostrar el panel de detalle (position:absolute sobre el left panel) */
  document.getElementById("detailPanel").classList.add("open");

  document.getElementById("dHero").innerHTML="<img src='"+PH+"' alt=''/>";

  document.getElementById("dInfo").innerHTML=
    "<span class='dbadge'>"+g.badge+"</span>"+
    "<div class='dtitle'>"+g.title+"</div>"+
    "<div class='ddesc'>"+g.desc+"</div>"+
    "<div class='dmeta'>"+g.count+"</div>"+
    "<button class='dcta' id='btnSave' data-saved='false'>Guardar los "+g.count+"</button>";

  document.getElementById("btnSave").addEventListener("click",function(){
    var saved=this.dataset.saved==="true";
    this.dataset.saved=String(!saved);
    this.classList.toggle("saved",!saved);
    this.textContent=!saved?"✓ Guardados":"Guardar los "+g.count;
    if(!saved){
      showToast("Sitios guardados en Mis lugares","success");
    }
  });

  document.getElementById("dSection").textContent="Selección";

  /* Spots: imagen con bm superpuesto + nombre + cat. SIN tag. */
  document.getElementById("dSpots").innerHTML=g.spots.map(function(s){
    var isSaved = savedSpots[s.n] === true;
    return "<div class='sitem' data-name='"+s.n+"' data-cat='"+s.t+"'>"+
      "<div class='sthumb'>"+
        "<img src='"+PH+"' alt=''/>"+
        "<div class='sthumb-bm"+(isSaved?" saved":"")+"' data-saved='"+(isSaved?"true":"false")+"' data-spot='"+s.n+"'>"+(isSaved?ICO_BMF:ICO_BM)+"</div>"+
      "</div>"+
      "<div class='sbody'>"+
        "<div class='sname'>"+s.n+"</div>"+
        "<div class='scat'>"+catIcon(s.t)+" "+s.t+"</div>"+
      "</div>"+
    "</div>";
  }).join("");

  /* Toggle bookmark en imagen */
  /* Click en el spot item abre la ficha */
  document.getElementById("dSpots").querySelectorAll(".sitem").forEach(function(item){
    item.addEventListener("click",function(e){
      if(e.target.closest(".sthumb-bm")) return;
      var name=item.dataset.name, cat=item.dataset.cat;
      openSpot(name,cat);
    });
  });
  document.getElementById("dSpots").querySelectorAll(".sthumb-bm").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var name = btn.dataset.spot;
      var saved = btn.dataset.saved === "true";
      setSpotSaved(name, !saved);
      if(!saved){
        showToast("Sitio guardado en Mis lugares","success");
      }
    });
  });

  document.getElementById("detailScroll").scrollTop=0;
  showSpotPins(g);
}

/* ── BACK ── */
document.getElementById("btnBack").addEventListener("click",function(){
  document.getElementById("detailPanel").classList.remove("open");
  document.getElementById("spotAside").classList.remove("open");
  ag=null;
  document.querySelectorAll(".gc").forEach(function(c){c.classList.remove("active");});
  showAllPins();
  mapObj.setView([41.3851,2.1734],13);
});

/* ── FILTERS ── */
document.querySelectorAll(".fp").forEach(function(p){
  p.addEventListener("click",function(){
    document.querySelectorAll(".fp").forEach(function(x){x.classList.remove("active");});
    p.classList.add("active");
    if(ag){document.getElementById("detailPanel").classList.remove("open");ag=null;}
    renderList();showAllPins();
  });
});

/* ── TABS ── */
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click",function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
    t.classList.add("active");
    activeTab=t.dataset.tab;
    document.querySelectorAll(".fp").forEach(function(x){x.classList.remove("active");});
    document.querySelector("[data-filter='todos']").classList.add("active");
    if(ag){document.getElementById("detailPanel").classList.remove("open");ag=null;}
    renderList();showAllPins();
  });
});

document.getElementById("btnLocate").addEventListener("click",function(){
  if(ag)showSpotPins(ag);else mapObj.setView([41.3851,2.1734],13);
});

function getSpotData(name) {
  return SPOT_DATA[name] || {
    desc:"Un lugar emblemático de Barcelona que no te puedes perder.",
    dir:"Barcelona, España",tel:"—",web:"—",
    h:{"Lunes":"10:00–20:00","Martes":"10:00–20:00","Miércoles":"10:00–20:00","Jueves":"10:00–20:00","Viernes":"10:00–20:00","Sábado":"10:00–20:00","Domingo":"10:00–20:00"},
    cat:"Punto de interés",rating:4.5
  };
}

/* ── SAVED SPOTS STATE (fuente de verdad compartida) ── */
var savedSpots = {};

function setSpotSaved(name, saved) {
  savedSpots[name] = saved;

  // Sincronizar el botón de la lista (sthumb-bm)
  var listBtn = document.querySelector('.sthumb-bm[data-spot="' + name + '"]');
  if (listBtn) {
    listBtn.dataset.saved = String(saved);
    listBtn.classList.toggle('saved', saved);
    listBtn.innerHTML = saved ? ICO_BMF : ICO_BM;
  }

  // Sincronizar el botón del aside si es el mismo spot abierto
  var aside = document.getElementById('spotAside');
  if (aside.classList.contains('open') && aside.dataset.spot === name) {
    var bmBtn = document.getElementById('spBmBtn');
    bmBtn.classList.toggle('saved', saved);
    bmBtn.innerHTML = saved
      ? '<svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17L10 13.5 5 17V4a1.5 1.5 0 011.5-1.5h7A1.5 1.5 0 0115 4z"/></svg>'
      : '<svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17L10 13.5 5 17V4a1.5 1.5 0 011.5-1.5h7A1.5 1.5 0 0115 4z"/></svg>';
  }
}

function renderStars(r) {
  var full = Math.floor(r), half = r % 1 >= 0.5;
  var html = '';
  for (var i=0;i<5;i++) {
    var fill = (i<full) ? '#fdd032' : (i===full&&half) ? 'url(#halfGrad)' : '#d9d9d9';
    html += '<svg viewBox="0 0 18 18" width="18" height="18"><defs><linearGradient id="halfGrad"><stop offset="50%" stop-color="#fdd032"/><stop offset="50%" stop-color="#d9d9d9"/></linearGradient></defs><path d="M9 1.5l2.06 4.17 4.6.67-3.33 3.24.79 4.58L9 11.77l-4.12 2.19.79-4.58L2.34 6.34l4.6-.67z" fill="'+fill+'"/></svg>';
  }
  return html;
}

function openSpot(spot, catType) {
  var d = getSpotData(spot);
  var aside = document.getElementById('spotAside');

  // image
  document.getElementById('spImg').src = PH;

  // bookmark state — se sincroniza desde savedSpots más abajo
  var bmBtn = document.getElementById('spBmBtn');

  // title
  document.getElementById('spTitle').textContent = spot;

  // meta: stars + rating + cat
  var catIcon = '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><path d="M8 1a7 7 0 017 7c0 4.5-7 8-7 8s-7-3.5-7-8a7 7 0 017-7z"/></svg>';
  document.getElementById('spMeta').innerHTML =
    '<div style="display:flex;align-items:center;gap:1.5px">'+renderStars(d.rating)+'</div>'+
    '<span class="sp-rating">'+d.rating+'</span>'+
    '<span class="sp-dot-sep">·</span>'+
    '<div class="sp-cat-row">'+catIcon+' '+(d.cat||catType)+'</div>';

  // desc
  document.getElementById('spDesc').textContent = d.desc;

  // info rows
  var rows = '';
  // Dirección
  rows += '<div class="sp-info-row">'+
    '<div class="sp-info-icon"><svg viewBox="0 0 16 16"><path d="M8 1a6 6 0 016 6c0 4-6 8-6 8S2 11 2 7a6 6 0 016-6z"/><circle cx="8" cy="7" r="2"/></svg></div>'+
    '<div class="sp-info-content"><div class="sp-info-label">Dirección</div><div class="sp-info-value">'+d.dir+'</div></div>'+
  '</div>';
  // Contacto
  if (d.tel !== '—') rows += '<div class="sp-info-row">'+
    '<div class="sp-info-icon"><svg viewBox="0 0 16 16"><path d="M14 11v2a1 1 0 01-1 1 12 12 0 01-11-11 1 1 0 011-1h2a1 1 0 011 .9l.4 2a1 1 0 01-.3.9l-.8.8a9 9 0 004.1 4.1l.8-.8a1 1 0 01.9-.3l2 .4a1 1 0 01.9 1z"/></svg></div>'+
    '<div class="sp-info-content"><div class="sp-info-label">Contacto</div><a class="sp-info-link" href="tel:'+d.tel+'">'+d.tel+'</a></div>'+
  '</div>';
  // Web
  if (d.web !== '—') rows += '<div class="sp-info-row">'+
    '<div class="sp-info-icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2C6.5 4 5.5 6 5.5 8s1 4 2.5 6M8 2c1.5 2 2.5 4 2.5 6s-1 4-2.5 6"/><line x1="2" y1="8" x2="14" y2="8"/></svg></div>'+
    '<div class="sp-info-content"><div class="sp-info-label">Página web</div><a class="sp-info-link" href="https://'+d.web+'" target="_blank">'+d.web+'</a></div>'+
  '</div>';
  // Horario
  var sched = '<div class="sp-schedule">';
  Object.keys(d.h).forEach(function(day){
    sched += '<div class="sp-sched-row"><span class="sp-sched-day">'+day+':</span><span class="sp-sched-time">'+d.h[day]+'</span></div>';
  });
  sched += '</div>';
  rows += '<div class="sp-info-row">'+
    '<div class="sp-info-icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><polyline points="8 5 8 8 10.5 10"/></svg></div>'+
    '<div class="sp-info-content"><div class="sp-info-label">Horario</div>'+sched+'</div>'+
  '</div>';

  document.getElementById('spInfo').innerHTML = rows;

  // show aside
  aside.dataset.spot = spot;
  aside.classList.add('open');

  // bookmark: leer estado desde savedSpots
  var isSaved = savedSpots[spot] === true;
  bmBtn.classList.toggle('saved', isSaved);
  bmBtn.innerHTML = isSaved
    ? '<svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17L10 13.5 5 17V4a1.5 1.5 0 011.5-1.5h7A1.5 1.5 0 0115 4z"/></svg>'
    : '<svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17L10 13.5 5 17V4a1.5 1.5 0 011.5-1.5h7A1.5 1.5 0 0115 4z"/></svg>';

  // bookmark toggle on cover
  bmBtn.onclick = function() {
    var nowSaved = !( savedSpots[spot] === true );
    setSpotSaved(spot, nowSaved);
    if(nowSaved){
      showToast("Sitio guardado en Mis lugares","success");
    }
  };
}

document.getElementById('spCloseBtn').addEventListener('click', function(){
  document.getElementById('spotAside').classList.remove('open');
});


document.addEventListener('DOMContentLoaded', function() {
  renderList();
  initMap();
});
</script>
