<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Filled / Outlined / Ghost · 3 sizes · text+icon / text / icon · disabled · save toggle" viewport="1100x540" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">

<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.section{margin-bottom:28px;}
.h{font:600 11px/14px var(--font-sans);color:var(--text-tertiary);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.lbl{font:600 12px/16px var(--font-sans);color:var(--text-tertiary);width:120px;flex-shrink:0;}

.btn{font-family:var(--font-sans);font-weight:600;letter-spacing:var(--ls-wide);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;transition:background var(--dur-base) var(--ease-standard),transform var(--dur-fast) var(--ease-standard);width:fit-content;}
.btn:active{transform:scale(.98);}
.btn:disabled{cursor:not-allowed;background:var(--neutral-50)!important;color:var(--neutral-500)!important;border-color:var(--neutral-100)!important;}
.btn:disabled iconify-icon{color:var(--neutral-400)!important;}
.btn iconify-icon{display:inline-block;width:1em;height:1em;line-height:1;}

.s48{height:var(--control-lg);padding:0 24px;font-size:16px;line-height:26px;} .s48 iconify-icon{font-size:20px;}
.s40{height:var(--control-md);padding:0 16px;font-size:14px;line-height:22px;} .s40 iconify-icon{font-size:20px;}
.s32{height:var(--control-sm);padding:0 12px;font-size:12px;line-height:19px;} .s32 iconify-icon{font-size:16px;}

.s48.icon{width:48px;padding:0;}
.s40.icon{width:40px;padding:0;}
.s32.icon{width:32px;padding:0;}

.filled{background:var(--primary-500);color:#fff;}
.filled:hover{background:var(--primary-600);}
.outlined{background:#fff;border-color:var(--border-default);color:var(--text-primary);}
.outlined:hover{background:var(--neutral-25);}
.ghost{background:transparent;color:var(--text-primary);}
.ghost:hover{background:var(--neutral-50);}

.btn.saved{color:var(--text-primary);}
.btn.saved iconify-icon{color:var(--primary-500);}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body style="font-family: &quot;Cerebri Sans&quot;">

<div class="section">
  <div class="h">Filled</div>
  <div class="row"><div class="lbl">Text + icon</div>
    <button class="btn s48 filled"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s40 filled"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s32 filled"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s40 filled" disabled><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Disabled</button>
  </div>
  <div class="row"><div class="lbl">Text only</div>
    <button class="btn s48 filled">Guardar</button>
    <button class="btn s40 filled">Guardar</button>
    <button class="btn s32 filled">Guardar</button>
    <button class="btn s40 filled" disabled>Disabled</button>
  </div>
  <div class="row"><div class="lbl">Icon only</div>
    <button class="btn s48 icon filled"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon filled"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s32 icon filled"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon filled" disabled><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
  </div>
</div>

<div class="section">
  <div class="h">Outlined</div>
  <div class="row"><div class="lbl">Text + icon</div>
    <button class="btn s48 outlined"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s40 outlined"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s32 outlined"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s40 outlined" disabled><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Disabled</button>
  </div>
  <div class="row"><div class="lbl">Text only</div>
    <button class="btn s48 outlined">Guardar</button>
    <button class="btn s40 outlined">Guardar</button>
    <button class="btn s32 outlined">Guardar</button>
    <button class="btn s40 outlined" disabled>Disabled</button>
  </div>
  <div class="row"><div class="lbl">Icon only</div>
    <button class="btn s48 icon outlined"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon outlined"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s32 icon outlined"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon outlined" disabled><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
  </div>
</div>

<div class="section">
  <div class="h">Ghost</div>
  <div class="row"><div class="lbl">Text + icon</div>
    <button class="btn s48 ghost"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s40 ghost"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s32 ghost"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardar</button>
    <button class="btn s40 ghost" disabled><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Disabled</button>
  </div>
  <div class="row"><div class="lbl">Text only</div>
    <button class="btn s48 ghost">Guardar</button>
    <button class="btn s40 ghost">Guardar</button>
    <button class="btn s32 ghost">Guardar</button>
    <button class="btn s40 ghost" disabled>Disabled</button>
  </div>
  <div class="row"><div class="lbl">Icon only</div>
    <button class="btn s48 icon ghost"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon ghost"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s32 icon ghost"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon ghost" disabled><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
  </div>
</div>

<div class="section">
  <div class="h">Save / Saved · toggle (icon switches Regular ↔ Fill, color stays)</div>
  <div class="row"><div class="lbl">Outlined</div>
    <button class="btn s48 outlined" onclick="t(this)"><iconify-icon icon="ph:bookmark-simple"></iconify-icon><span>Guardar</span></button>
    <button class="btn s40 outlined" onclick="t(this)"><iconify-icon icon="ph:bookmark-simple"></iconify-icon><span>Guardar</span></button>
    <button class="btn s32 outlined" onclick="t(this)"><iconify-icon icon="ph:bookmark-simple"></iconify-icon><span>Guardar</span></button>
    <button class="btn s48 outlined saved" onclick="t(this)"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon><span>Guardado</span></button>
    <button class="btn s40 outlined saved" onclick="t(this)"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon><span>Guardado</span></button>
    <button class="btn s32 outlined saved" onclick="t(this)"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon><span>Guardado</span></button>
  </div>
  <div class="row"><div class="lbl">Icon only · floating</div>
    <button class="btn s48 icon outlined" onclick="ti(this)"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s40 icon outlined" onclick="ti(this)"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s32 icon outlined" onclick="ti(this)"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></button>
    <button class="btn s48 icon outlined saved" onclick="ti(this)"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button>
    <button class="btn s40 icon outlined saved" onclick="ti(this)"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button>
    <button class="btn s32 icon outlined saved" onclick="ti(this)"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button>
  </div>
</div>

<script>
function t(b){const on=b.classList.toggle('saved');const i=b.querySelector('iconify-icon');const s=b.querySelector('span');i.setAttribute('icon',on?'ph:bookmark-simple-fill':'ph:bookmark-simple');s.textContent=on?'Guardado':'Guardar';}
function ti(b){const on=b.classList.toggle('saved');const i=b.querySelector('iconify-icon');i.setAttribute('icon',on?'ph:bookmark-simple-fill':'ph:bookmark-simple');}
</script>
</body></html>
