<!doctype html>
<!-- @dsCard group="Colors" name="Feedback · Informative" subtitle="12 shades de Informative (#0060b2)" viewport="1200x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:20px;background:#fff;}
.title{font:700 14px/22px var(--font-sans);color:var(--text-primary);margin:0 0 4px;}
.sub{font:400 12px/16px var(--font-sans);color:var(--text-tertiary);margin:0 0 14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.swatch{width:88px;}
.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}
.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}
.hex{font:400 10px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head>
<body>
<h2 class="title">Informative</h2>
<p class="sub">links · info</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--informative-25);"></div><div class="lbl">25</div><div class="hex">#eff6fc</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-50);"></div><div class="lbl">50</div><div class="hex">#dceaf6</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-100);"></div><div class="lbl">100</div><div class="hex">#b9d6ed</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-200);"></div><div class="lbl">200</div><div class="hex">#8db9df</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-300);"></div><div class="lbl">300</div><div class="hex">#5d9bd0</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-400);"></div><div class="lbl">400</div><div class="hex">#2e7ec1</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-500);outline:2px solid #0060b240;outline-offset:2px;"></div><div class="lbl">500 · base</div><div class="hex">#0060b2</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-600);"></div><div class="lbl">600</div><div class="hex">#004d8e</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-700);"></div><div class="lbl">700</div><div class="hex">#003a6b</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-800);"></div><div class="lbl">800</div><div class="hex">#002647</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-900);"></div><div class="lbl">900</div><div class="hex">#001324</div></div>
  <div class="swatch"><div class="chip" style="background:var(--informative-950);"></div><div class="lbl">950</div><div class="hex">#000a12</div></div>
</div>
</body></html>
