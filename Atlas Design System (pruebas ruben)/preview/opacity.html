<!doctype html>
<!-- @dsCard group="Spacing" name="Opacity" subtitle="scrims & washes · scrim 0.60 reconstruye --bg-overlay" viewport="700x190" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .tile { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .chip { width: 110px; height: 72px; border-radius: var(--radius-md); position: relative; background-image: linear-gradient(45deg,#e6e8ea 25%,transparent 25%),linear-gradient(-45deg,#e6e8ea 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e8ea 75%),linear-gradient(-45deg,transparent 75%,#e6e8ea 75%); background-size:14px 14px; background-position:0 0,0 7px,7px -7px,-7px 0; overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip span { position: absolute; inset: 0; background: rgb(var(--overlay-tint)); }
  .l { font: 700 11px/14px var(--font-sans); color: var(--text-primary); }
  .v { font: 400 11px/14px ui-monospace, Menlo, monospace; color: var(--text-secondary); text-align:center; }
</style></head><body>
<div class="row">
  <div class="tile"><div class="chip"><span style="opacity:var(--opacity-faint)"></span></div><div class="l">faint</div><div class="v">0.04 · hover tint</div></div>
  <div class="tile"><div class="chip"><span style="opacity:var(--opacity-subtle)"></span></div><div class="l">subtle</div><div class="v">0.08</div></div>
  <div class="tile"><div class="chip"><span style="opacity:var(--opacity-muted)"></span></div><div class="l">muted</div><div class="v">0.16</div></div>
  <div class="tile"><div class="chip"><span style="opacity:var(--opacity-scrim)"></span></div><div class="l">scrim</div><div class="v">0.60 · modal overlay</div></div>
</div>
</body></html>
