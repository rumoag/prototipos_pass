<!doctype html>
<!-- @dsCard group="Colors" name="Secondary · Terracota" subtitle="Warm orange accent · base #e66000" viewport="1100x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:20px;background:#fff;}.row{display:flex;gap:14px;flex-wrap:wrap;}.swatch{width:88px;}.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}.hex{font:400 10px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}</style>
</head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--secondary-25)"></div><div class="lbl">25</div><div class="hex">#fff0e6</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-50)"></div><div class="lbl">50</div><div class="hex">#ffdbc2</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-100)"></div><div class="lbl">100</div><div class="hex">#ffb385</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-200)"></div><div class="lbl">200</div><div class="hex">#ff8c47</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-300)"></div><div class="lbl">300</div><div class="hex">#ff7b24</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-400)"></div><div class="lbl">400</div><div class="hex">#ff6b00</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-500);outline:2px solid #e6600040;outline-offset:2px;"></div><div class="lbl">500 · base</div><div class="hex">#e66000</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-600)"></div><div class="lbl">600</div><div class="hex">#b34b00</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-700)"></div><div class="lbl">700</div><div class="hex">#803500</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-800)"></div><div class="lbl">800</div><div class="hex">#4d2000</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-900)"></div><div class="lbl">900</div><div class="hex">#381700</div></div>
  <div class="swatch"><div class="chip" style="background:var(--secondary-950)"></div><div class="lbl">950</div><div class="hex">#2e1300</div></div>
</div>
</body></html>
