<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="5-step shadow scale (cool blue)" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:32px;background:#fff;}
.row{display:flex;gap:28px;flex-wrap:wrap;}
.tile{width:120px;display:flex;flex-direction:column;gap:10px;align-items:center;}
.box{width:96px;height:64px;background:#fff;border-radius:10px;}
.l{font:600 11px/14px var(--font-sans);color:var(--text-primary);}
.v{font:400 11px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head><body>
<div class="row">
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-xs);"></div><div class="l">xs</div><div class="v">chips</div></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-sm);"></div><div class="l">sm</div><div class="v">tooltips</div></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-md);"></div><div class="l">md</div><div class="v">menus</div></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-lg);"></div><div class="l">lg</div><div class="v">popovers</div></div>
  <div class="tile"><div class="box" style="box-shadow:var(--shadow-xl);"></div><div class="l">xl</div><div class="v">modals</div></div>
</div>
</body></html>
