<!doctype html>
<!-- @dsCard group="Components" name="Add place panel" subtitle="Side panel — search, chips & results" viewport="480x680" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:var(--neutral-25);font-family:var(--font-sans);}
.aside{width:420px;background:#fff;border:1px solid var(--border-subtle);border-radius:12px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden;}
.head{padding:16px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.title{font:700 20px/32px var(--font-sans);letter-spacing:-.03em;color:var(--text-primary);margin:0;}
.icon-btn{width:32px;height:32px;border-radius:9999px;background:rgba(255,255,255,.95);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary);box-shadow:var(--shadow-xs);}
.icon-btn iconify-icon{font-size:16px;}
.daypill{display:inline-flex;align-items:center;gap:8px;padding:0 16px 12px;font:400 13px/20px var(--font-sans);color:var(--neutral-700);}
.dot{width:14px;height:14px;border-radius:9999px;background:var(--day-2);}
.subtabs{display:flex;gap:0;padding:0 16px;margin-bottom:12px;border-bottom:1px solid var(--border-subtle);}
.subtab{background:transparent;border:0;padding:10px 4px;margin-right:24px;font:600 14px/22px var(--font-sans);color:var(--neutral-700);cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:8px;}
.subtab iconify-icon{font-size:16px;}
.subtab.active{color:var(--text-primary);}
.subtab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--neutral-900);border-radius:2px;}
.search{display:flex;align-items:center;gap:10px;margin:0 16px 12px;padding:0 16px;height:48px;border:1px solid var(--border-default);border-radius:9999px;font:400 14px/1 var(--font-sans);color:var(--neutral-500);background:#fff;}
.search iconify-icon{font-size:20px;color:var(--neutral-700);}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;}
.chip{flex:0 0 auto;height:40px;padding:0 14px;border:1px solid var(--border-subtle);background:#fff;border-radius:9999px;font:600 13px/1 var(--font-sans);color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;}
.chip iconify-icon{font-size:16px;color:var(--neutral-800);}
.chip.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500);}
.chip.active iconify-icon{color:#fff;}
.results{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;}
.card{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--border-subtle);border-radius:12px;}
.drag{color:var(--neutral-400);font-size:18px;cursor:grab;flex-shrink:0;}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;background:var(--neutral-100) url('../assets/placeholder-image.png') center/cover;flex-shrink:0;}
.bm{position:absolute;top:6px;left:6px;width:28px;height:28px;border:0;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-500);cursor:pointer;box-shadow:var(--shadow-xs);}
.bm iconify-icon{font-size:16px;}
.bm-only{width:28px;height:28px;border:0;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-500);cursor:pointer;box-shadow:var(--shadow-xs);flex-shrink:0;}
.bm-only iconify-icon{font-size:16px;}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.ctitle{font:700 15px/22px var(--font-sans);color:var(--text-primary);letter-spacing:-.01em;}
.ccat{display:inline-flex;align-items:center;gap:6px;font:400 13px/18px var(--font-sans);color:var(--neutral-700);}
.ccat iconify-icon{font-size:14px;}
.add{width:32px;height:32px;border-radius:9999px;border:1px solid var(--border-default);background:#fff;color:var(--text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.add iconify-icon{font-size:16px;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<div class="aside">
  <div class="head"><h2 class="title">Añadir lugar</h2><button class="icon-btn"><iconify-icon icon="ph:x"></iconify-icon></button></div>
  <div class="daypill"><span class="dot"></span><span>Dom. 14 set</span></div>
  <div class="subtabs">
    <button class="subtab active"><iconify-icon icon="ph:compass"></iconify-icon>Explorar</button>
    <button class="subtab"><iconify-icon icon="ph:bookmark-simple"></iconify-icon>Guardados</button>
  </div>
  <div class="search"><iconify-icon icon="ph:magnifying-glass"></iconify-icon><span>Buscar un lugar, restaurante, hotel…</span></div>
  <div class="chips">
    <button class="chip active"><iconify-icon icon="ph:star-fill"></iconify-icon>Recomendados</button>
    <button class="chip"><iconify-icon icon="ph:camera"></iconify-icon>Qué hacer</button>
    <button class="chip"><iconify-icon icon="ph:bed"></iconify-icon>Hoteles</button>
  </div>
  <div class="results">
    <div class="card">
      <iconify-icon icon="ph:dots-six-vertical" class="drag"></iconify-icon>
      <button class="bm-only"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button>
      <div class="meta">
        <div class="ctitle">Mercat de Sant Antoni</div>
        <div class="ccat"><iconify-icon icon="ph:camera"></iconify-icon>Puntos de interés turístico</div>
      </div>
      <button class="add"><iconify-icon icon="ph:plus"></iconify-icon></button>
    </div>
    <div class="card">
      <iconify-icon icon="ph:dots-six-vertical" class="drag"></iconify-icon>
      <div class="thumb"><button class="bm"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button></div>
      <div class="meta">
        <div class="ctitle">Museu Nacional d'Art de Catalunya</div>
        <div class="ccat"><iconify-icon icon="ph:bank"></iconify-icon>Museo</div>
      </div>
      <button class="add"><iconify-icon icon="ph:plus"></iconify-icon></button>
    </div>
    <div class="card">
      <iconify-icon icon="ph:dots-six-vertical" class="drag"></iconify-icon>
      <div class="thumb"><button class="bm"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button></div>
      <div class="meta">
        <div class="ctitle">Hotel Barcelona Universal</div>
        <div class="ccat"><iconify-icon icon="ph:bed"></iconify-icon>Hoteles</div>
      </div>
      <button class="add"><iconify-icon icon="ph:plus"></iconify-icon></button>
    </div>
  </div>
</div>
</body></html>
