<!doctype html>

<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">

<style>
*{box-sizing:border-box;}
body{margin:0;padding:24px;background:var(--neutral-25);font-family:var(--font-sans);}
.row{display:flex;gap:24px;align-items:flex-start;}
.app{display:flex;background:#fff;border:1px solid var(--border-subtle);border-radius:12px;overflow:hidden;height:640px;}
/* === Expanded sidebar === */
.sidebar{width:264px;flex-shrink:0;background:#fff;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:12px 12px 8px;}
.brand-row{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:8px;cursor:pointer;}
.brand-row:hover{background:var(--neutral-25);}
.brand-logo{width:24px;height:24px;flex-shrink:0;margin-top:2px;color:var(--primary-500);display:inline-flex;}
.brand-logo svg{display:block;width:24px;height:24px;}
.brand-text{display:flex;flex-direction:column;gap:2px;}
.brand-title{font:700 16px/22px var(--font-sans);color:var(--text-primary);letter-spacing:-.01em;}
.brand-sub{font:400 13px/18px var(--font-sans);color:var(--neutral-600);}
.brand-caret{margin-left:auto;color:var(--neutral-700);font-size:14px;align-self:center;}
.divider{height:1px;background:var(--border-subtle);margin:8px 4px;}
.section{display:flex;flex-direction:column;gap:2px;}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;font:500 14px/20px var(--font-sans);color:var(--neutral-900);cursor:pointer;}
.item:hover{background:var(--neutral-25);}
.item.active{background:var(--neutral-50);color:var(--neutral-950);}
.item iconify-icon{font-size:20px;color:var(--neutral-700);flex-shrink:0;}
.group{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 10px;font:700 13px/18px var(--font-sans);color:var(--neutral-900);cursor:pointer;border-radius:8px;}
.group:hover{background:var(--neutral-25);}
.group i{font-size:14px;color:var(--neutral-700);transition:transform var(--dur-base) var(--ease-standard);}
.group.collapsed i{transform:rotate(-90deg);}
.group.collapsed + .section{display:none;}
.badge{margin-left:auto;display:inline-flex;align-items:center;padding:1px 8px;border-radius:9999px;background:var(--primary-50);color:var(--primary-800);font:600 11px/16px var(--font-sans);letter-spacing:.01em;}
.spacer{flex:1;}
.foot{display:flex;flex-direction:column;gap:2px;padding:8px 0 4px;border-top:1px solid var(--border-subtle);margin-top:8px;}
.foot .item{justify-content:flex-start;}

/* === Collapsed sidebar (icons only) === */
.sidebar.col{width:64px;padding:12px 8px 8px;align-items:center;}
.sidebar.col .brand-row{padding:8px 6px;justify-content:center;gap:2px;}
.sidebar.col .brand-row .brand-text{display:none;}
.sidebar.col .brand-caret{margin-left:0;font-size:12px;}
.sidebar.col .divider{width:48px;align-self:center;}
.sidebar.col .group,
.sidebar.col .group-cap{display:none;}
.sidebar.col .item{justify-content:center;padding:9px;width:40px;height:40px;gap:0;}
.sidebar.col .item span,
.sidebar.col .item .badge{display:none;}
.sidebar.col .foot{align-self:stretch;align-items:center;}
.canvas{flex:1;background:#fff;min-width:200px;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
