<!doctype html>
<!-- @dsCard group="Colors" name="Semantic Tokens" subtitle="Text + background semantic mappings" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:24px;background:#fff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border-subtle);border-radius:12px;}
.swatch{width:36px;height:36px;border-radius:8px;flex-shrink:0;border:1px solid rgba(0,0,0,.05);}
.k{font:600 13px/18px var(--font-sans);color:var(--text-primary);}
.v{font:400 11px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head><body>
<div class="grid">
  <div class="row"><div class="swatch" style="background:var(--text-brand)"></div><div><div class="k">Text · Brand</div><div class="v">primary-800</div></div></div>
  <div class="row"><div class="swatch" style="background:var(--text-primary)"></div><div><div class="k">Text · Primary</div><div class="v">neutral-950</div></div></div>
  <div class="row"><div class="swatch" style="background:var(--text-secondary)"></div><div><div class="k">Text · Secondary</div><div class="v">neutral-800</div></div></div>
  <div class="row"><div class="swatch" style="background:var(--text-link)"></div><div><div class="k">Text · Link</div><div class="v">informative-500</div></div></div>
  <div class="row"><div class="swatch" style="background:var(--text-disabled)"></div><div><div class="k">Text · Disabled</div><div class="v">neutral-500</div></div></div>
  <div class="row"><div class="swatch" style="background:var(--bg-inverse)"></div><div><div class="k">Background · Inverse</div><div class="v">eucalipto night #1b352c</div></div></div>
</div>
</body></html>
