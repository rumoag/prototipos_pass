<!doctype html>
<!-- @dsCard group="Components" name="Toasts" subtitle="Success + error · sin negrita" viewport="500x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:18px;background:#F8F9FA;font-family:var(--font-sans);display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;gap:12px;align-items:center;padding:12px 16px;background:#FFF;border-radius:8px;box-shadow:0 8px 24px -4px rgba(0,0,0,.12),0 2px 6px -2px rgba(16,24,40,.06);max-width:440px;}
.c{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.c.success{background:#59C09C;}
.c.error{background:#FF789A;}
.msg{font-size:14px;color:#021F15;letter-spacing:-0.24px;flex:1;}
.x{color:#808F8A;cursor:pointer;font-size:18px;line-height:1;}
</style></head><body>
<div class="toast">
  <div class="c success">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="m3 7 3 3 5-6" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="msg">Sitio guardado en Mis lugares</div>
  <div class="x">×</div>
</div>
<div class="toast">
  <div class="c error">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 4l6 6M10 4l-6 6" stroke="#FFF" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <div class="msg">No se pudo guardar el sitio. Inténtalo de nuevo.</div>
  <div class="x">×</div>
</div>
</body></html>
