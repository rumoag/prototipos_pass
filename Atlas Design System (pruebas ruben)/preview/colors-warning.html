<!doctype html>
<!-- @dsCard group="Colors" name="Feedback · Warning" subtitle="12 shades de Warning (#c48a02)" viewport="1200x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:20px;background:#fff;}
.title{font:700 14px/22px var(--font-sans);color:var(--text-primary);margin:0 0 4px;}
.sub{font:400 12px/16px var(--font-sans);color:var(--text-tertiary);margin:0 0 14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.swatch{width:88px;}
.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}
.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}
.hex{font:400 10px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head>
<body>
<h2 class="title">Warning</h2>
<p class="sub">caution · attention</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--warning-25);"></div><div class="lbl">25</div><div class="hex">#fdf8eb</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-50);"></div><div class="lbl">50</div><div class="hex">#fbf0d4</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-100);"></div><div class="lbl">100</div><div class="hex">#f6e1a9</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-200);"></div><div class="lbl">200</div><div class="hex">#ecc975</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-300);"></div><div class="lbl">300</div><div class="hex">#ddb148</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-400);"></div><div class="lbl">400</div><div class="hex">#d29b1f</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-500);outline:2px solid #c48a0240;outline-offset:2px;"></div><div class="lbl">500 · base</div><div class="hex">#c48a02</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-600);"></div><div class="lbl">600</div><div class="hex">#9d6e02</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-700);"></div><div class="lbl">700</div><div class="hex">#765301</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-800);"></div><div class="lbl">800</div><div class="hex">#4e3701</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-900);"></div><div class="lbl">900</div><div class="hex">#271c00</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-950);"></div><div class="lbl">950</div><div class="hex">#140e00</div></div>
</div>
</body></html>
