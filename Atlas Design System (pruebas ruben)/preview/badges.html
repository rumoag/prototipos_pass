<!doctype html>
<!-- @dsCard group="Components" name="Badges" subtitle="Status pills across the palette" viewport="700x110" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.b{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9999px;font:600 12px/19px var(--font-sans);letter-spacing:.01em;border:1px solid transparent;}
.dot{width:6px;height:6px;border-radius:50%;}
.bn{background:var(--neutral-50);color:var(--text-primary);border-color:var(--neutral-100);}
.bp{background:var(--primary-25);color:var(--primary-800);}
.bs{background:var(--secondary-25);color:var(--secondary-700);}
.bg{background:var(--positive-50);color:var(--positive-800);}
.br{background:var(--negative-50);color:var(--negative-800);}
.bw{background:var(--warning-50);color:var(--warning-800);}
.bi{background:var(--informative-50);color:var(--informative-800);}
.bd{background:var(--bg-inverse);color:#fff;}
</style></head><body>
<span class="b bn">Borrador</span>
<span class="b bp"><span class="dot" style="background:var(--primary-500);"></span>Nuevo</span>
<span class="b bs">Promo</span>
<span class="b bg"><span class="dot" style="background:var(--positive-500);"></span>Reservado</span>
<span class="b br">Cancelado</span>
<span class="b bw">Pendiente</span>
<span class="b bi">Próximamente</span>
<span class="b bd">Premium</span>
</body></html>
