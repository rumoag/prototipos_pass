<!doctype html>
<!-- @dsCard group="Colors" name="Feedback · Positive" subtitle="12 shades de Positive (#398a5e)" viewport="1200x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:20px;background:#fff;}
.title{font:700 14px/22px var(--font-sans);color:var(--text-primary);margin:0 0 4px;}
.sub{font:400 12px/16px var(--font-sans);color:var(--text-tertiary);margin:0 0 14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.swatch{width:88px;}
.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}
.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}
.hex{font:400 10px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head>
<body>
<h2 class="title">Positive</h2>
<p class="sub">success · confirmed</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--positive-25);"></div><div class="lbl">25</div><div class="hex">#f2f9f5</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-50);"></div><div class="lbl">50</div><div class="hex">#e6f3eb</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-100);"></div><div class="lbl">100</div><div class="hex">#cce7d7</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-200);"></div><div class="lbl">200</div><div class="hex">#a7cdb9</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-300);"></div><div class="lbl">300</div><div class="hex">#83b69a</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-400);"></div><div class="lbl">400</div><div class="hex">#5ea07c</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-500);outline:2px solid #398a5e40;outline-offset:2px;"></div><div class="lbl">500 · base</div><div class="hex">#398a5e</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-600);"></div><div class="lbl">600</div><div class="hex">#2e6e4b</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-700);"></div><div class="lbl">700</div><div class="hex">#225338</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-800);"></div><div class="lbl">800</div><div class="hex">#173726</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-900);"></div><div class="lbl">900</div><div class="hex">#0b1c13</div></div>
  <div class="swatch"><div class="chip" style="background:var(--positive-950);"></div><div class="lbl">950</div><div class="hex">#060e09</div></div>
</div>
</body></html>
