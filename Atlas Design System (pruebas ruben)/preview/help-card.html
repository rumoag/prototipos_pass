<!doctype html>
<!-- @dsCard group="Components" name="Help Card" subtitle="Card promocional inline para travel specialists" viewport="400x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:var(--neutral-25);font-family:var(--font-sans);}
.card{width:340px;background:var(--neutral-50);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;}
.t{font:700 18px/24px var(--font-sans);color:var(--text-primary);letter-spacing:-.01em;}
.d{font:400 14px/20px var(--font-sans);color:var(--neutral-700);}
.illus{margin-top:8px;height:60px;display:flex;align-items:flex-end;gap:-12px;}
.illus span{width:48px;height:48px;border-radius:9999px;background:var(--primary-200);border:2px solid var(--neutral-50);margin-left:-12px;}
.illus span:first-child{margin-left:0;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<div class="card">
  <div class="t">¿Te echamos una mano con tu viaje?</div>
  <div class="d">Contacta ahora con nuestros travel specialists para convertir tu idea de viaje en un plan real.</div>
  <div class="illus"><span></span><span style="background:var(--secondary-300);"></span><span style="background:var(--primary-400);"></span></div>
</div>
</body></html>
