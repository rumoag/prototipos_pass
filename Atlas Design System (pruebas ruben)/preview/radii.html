<!doctype html>
<!-- @dsCard group="Spacing" name="Border Radii" subtitle="xs 4 → full · buttons 8, cards 12, modals 16" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:24px;background:#fff;}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
.tile{display:flex;flex-direction:column;gap:8px;align-items:center;}
.shape{width:96px;height:64px;background:var(--primary-500);border:1px solid var(--primary-600);}
.l{font:600 11px/14px var(--font-sans);color:var(--text-primary);}
.v{font:400 11px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head><body>
<div class="row">
  <div class="tile"><div class="shape" style="border-radius:4px;"></div><div class="l">xs</div><div class="v">4px</div></div>
  <div class="tile"><div class="shape" style="border-radius:6px;"></div><div class="l">sm</div><div class="v">6px</div></div>
  <div class="tile"><div class="shape" style="border-radius:8px;"></div><div class="l">md · buttons</div><div class="v">8px</div></div>
  <div class="tile"><div class="shape" style="border-radius:12px;"></div><div class="l">lg · cards</div><div class="v">12px</div></div>
  <div class="tile"><div class="shape" style="border-radius:16px;"></div><div class="l">xl · modals</div><div class="v">16px</div></div>
  <div class="tile"><div class="shape" style="border-radius:20px;"></div><div class="l">2xl · pills</div><div class="v">20px</div></div>
  <div class="tile"><div class="shape" style="border-radius:9999px;width:64px;"></div><div class="l">full</div><div class="v">9999</div></div>
</div>
</body></html>
