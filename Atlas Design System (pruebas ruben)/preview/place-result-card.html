<!doctype html>
<!-- @dsCard group="Components" name="Place result card" subtitle="Search result row — always with image" viewport="480x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;gap:12px;max-width:420px;}
.card{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--border-subtle);border-radius:12px;}
.drag{color:var(--neutral-400);font-size:18px;cursor:grab;flex-shrink:0;}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;background:var(--neutral-100) url('../assets/placeholder-image.png') center/cover;flex-shrink:0;}
.bm{position:absolute;top:6px;left:6px;width:28px;height:28px;border:0;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-500);cursor:pointer;box-shadow:var(--shadow-xs);}
.bm iconify-icon{font-size:16px;}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.title{font:700 15px/22px var(--font-sans);color:var(--text-primary);letter-spacing:-.01em;}
.cat{display:inline-flex;align-items:center;gap:6px;font:400 13px/18px var(--font-sans);color:var(--neutral-700);}
.cat iconify-icon{font-size:14px;}
.add{width:32px;height:32px;border-radius:9999px;border:1px solid var(--border-default);background:#fff;color:var(--text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.add iconify-icon{font-size:16px;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<div class="card">
  <iconify-icon icon="ph:dots-six-vertical" class="drag"></iconify-icon>
  <div class="thumb"><button class="bm"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button></div>
  <div class="meta">
    <div class="title">Museu Nacional d'Art de Catalunya</div>
    <div class="cat"><iconify-icon icon="ph:bank"></iconify-icon>Museo</div>
  </div>
  <button class="add"><iconify-icon icon="ph:plus"></iconify-icon></button>
</div>
<div class="card">
  <iconify-icon icon="ph:dots-six-vertical" class="drag"></iconify-icon>
  <div class="thumb"><button class="bm"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button></div>
  <div class="meta">
    <div class="title">Mercat de Sant Antoni</div>
    <div class="cat"><iconify-icon icon="ph:camera"></iconify-icon>Puntos de interés turístico</div>
  </div>
  <button class="add"><iconify-icon icon="ph:plus"></iconify-icon></button>
</div>
<div class="card">
  <iconify-icon icon="ph:dots-six-vertical" class="drag"></iconify-icon>
  <div class="thumb"><button class="bm"><iconify-icon icon="ph:bookmark-simple-fill"></iconify-icon></button></div>
  <div class="meta">
    <div class="title">Hotel Barcelona Universal</div>
    <div class="cat"><iconify-icon icon="ph:bed"></iconify-icon>Hoteles</div>
  </div>
  <button class="add"><iconify-icon icon="ph:plus"></iconify-icon></button>
</div>
</body></html>
