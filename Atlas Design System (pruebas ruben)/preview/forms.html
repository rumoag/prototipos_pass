<!doctype html>
<!-- @dsCard group="Components" name="Form Controls" subtitle="Input · toggle · checkbox" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.field{display:flex;align-items:center;gap:8px;height:var(--control-lg);padding:0 14px;border:1px solid var(--border-default);border-radius:8px;background:#fff;width:260px;}
.field:focus-within{border-color:var(--border-focus);}
.field:has(:focus-visible){outline:var(--focus-ring-width) solid var(--focus-ring-color);outline-offset:var(--focus-ring-offset);}
.field input{border:0;outline:0;flex:1;font:400 14px/22px var(--font-sans);color:var(--text-primary);background:transparent;}
.field input::placeholder{color:var(--text-disabled);}
.field i{color:var(--icon-subtle);font-size:20px;}
.tog{display:flex;align-items:center;gap:10px;font:600 14px/22px var(--font-sans);color:var(--text-primary);}
.sw{position:relative;width:40px;height:24px;background:var(--neutral-300);border-radius:9999px;transition:background var(--dur-base);}
.sw.on{background:var(--primary-500);}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform var(--dur-base);box-shadow:var(--shadow-xs);}
.sw.on::after{transform:translateX(16px);}
.chk{width:20px;height:20px;border:var(--border-medium) solid var(--neutral-400);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:#fff;}
.chk.on{background:var(--primary-500);border-color:var(--primary-500);color:#fff;}
.chk.on::after{content:"";display:block;width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(2px,-1px);}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<div class="field"><iconify-icon icon="ph:magnifying-glass-light"></iconify-icon><input placeholder="Busca un destino"></div>
<div class="tog"><span class="sw on"></span>Notificaciones</div>
<div class="tog"><span class="sw"></span>Modo offline</div>
<div class="tog"><span class="chk on"></span>Recordarme</div>
<div class="tog"><span class="chk"></span>Acepto los términos</div>
</body></html>
