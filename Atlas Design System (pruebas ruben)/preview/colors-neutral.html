<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Surface + text neutral scale 25→950" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;padding:20px;background:#fff;}.row{display:flex;gap:14px;flex-wrap:wrap;}.swatch{width:88px;}.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}.hex{font:400 10px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}</style>
</head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--neutral-25);border:1px solid var(--neutral-100);"></div><div class="lbl">25</div><div class="hex">#f8f9fa</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-50)"></div><div class="lbl">50</div><div class="hex">#eef0f1</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-100)"></div><div class="lbl">100</div><div class="hex">#e6e8ea</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-200)"></div><div class="lbl">200</div><div class="hex">#dde0e3</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-300)"></div><div class="lbl">300</div><div class="hex">#cdd1d6</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-400)"></div><div class="lbl">400</div><div class="hex">#bcc1c8</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-500)"></div><div class="lbl">500</div><div class="hex">#abb2ba</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-600)"></div><div class="lbl">600</div><div class="hex">#8e949c</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-700)"></div><div class="lbl">700</div><div class="hex">#72777d</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-800)"></div><div class="lbl">800</div><div class="hex">#55595f</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-900)"></div><div class="lbl">900</div><div class="hex">#393c40</div></div>
  <div class="swatch"><div class="chip" style="background:var(--neutral-950)"></div><div class="lbl">950</div><div class="hex">#2a2d31</div></div>
</div>
</body></html>
