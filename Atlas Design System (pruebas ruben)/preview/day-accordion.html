<!doctype html>
<!-- @dsCard group="Components" name="Day accordion" subtitle="Closed + open with description & CTAs" viewport="600x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;gap:8px;max-width:560px;}
.day{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border-subtle);border-radius:8px;background:#fff;cursor:pointer;}
.day.open{background:var(--neutral-25);border-color:var(--neutral-200);}
.day:hover{background:var(--neutral-25);}
.dot{width:14px;height:14px;border-radius:9999px;flex-shrink:0;}
.label{font:700 14px/22px var(--font-sans);color:var(--text-primary);}
.count{font:400 13px/18px var(--font-sans);color:var(--neutral-700);margin-left:8px;}
.eye{margin-left:8px;color:var(--neutral-700);font-size:18px;}
.caret{margin-left:auto;color:var(--neutral-700);font-size:18px;transition:transform .2s;}
.day.open .caret{transform:rotate(180deg);}
.open-content{margin-top:-4px;padding:14px;background:var(--neutral-25);border:1px solid var(--border-subtle);border-top:0;border-radius:0 0 8px 8px;display:flex;flex-direction:column;gap:12px;}
.desc{width:100%;box-sizing:border-box;min-height:48px;resize:none;border:1px solid var(--border-default);border-radius:8px;background:#fff;padding:13px 14px;font:400 14px/22px var(--font-sans);color:var(--text-primary);outline:none;}
.desc::placeholder{color:var(--neutral-500);}
.ctas{display:flex;gap:8px;flex-wrap:wrap;}
.cta{height:40px;padding:0 14px;border:1px solid var(--border-default);background:#fff;border-radius:8px;font:600 14px/1 var(--font-sans);color:var(--text-primary);display:inline-flex;align-items:center;gap:8px;cursor:pointer;}
.cta iconify-icon{font-size:16px;color:var(--neutral-800);}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<div class="day"><span class="dot" style="background:var(--day-1);"></span><span class="label">Sáb. 13 set</span><span class="count">0 lugares</span><iconify-icon icon="ph:eye" class="eye"></iconify-icon><iconify-icon icon="ph:caret-down" class="caret"></iconify-icon></div>
<div style="display:flex;flex-direction:column;margin:0;">
  <div class="day open" style="border-radius:8px 8px 0 0;border-bottom:0;"><span class="dot" style="background:var(--day-2);"></span><span class="label">Dom. 14 set</span><span class="count">1 lugar</span><iconify-icon icon="ph:eye" class="eye"></iconify-icon><iconify-icon icon="ph:caret-down" class="caret"></iconify-icon></div>
  <div class="open-content">
    <textarea class="desc" placeholder="Añade una descripción para este día…"></textarea>
    <div class="ctas">
      <button class="cta"><iconify-icon icon="ph:plus"></iconify-icon>Añadir lugar</button>
      <button class="cta"><iconify-icon icon="ph:clock"></iconify-icon>Añadir bloque horario</button>
    </div>
  </div>
</div>
<div class="day"><span class="dot" style="background:var(--day-3);"></span><span class="label">Lun. 15 set</span><span class="count">3 lugares</span><iconify-icon icon="ph:eye" class="eye"></iconify-icon><iconify-icon icon="ph:caret-down" class="caret"></iconify-icon></div>
</body></html>
