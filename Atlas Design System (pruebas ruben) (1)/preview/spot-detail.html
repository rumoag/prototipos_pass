<!doctype html>
<!-- @dsCard group="Components" name="Spot detail" subtitle="Cover + rating + actions + info rows" viewport="480x820" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:var(--neutral-25);font-family:var(--font-sans);}
.aside{width:420px;height:760px;background:#fff;border:1px solid var(--border-subtle);border-radius:12px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:auto;}
.cover{position:relative;height:242px;flex-shrink:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 50%),url('../assets/placeholder-image.png') center/cover;}
.cover-bar{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;}
.icon-btn{width:32px;height:32px;border-radius:9999px;background:rgba(255,255,255,.95);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary);box-shadow:var(--shadow-xs);}
.icon-btn iconify-icon{font-size:16px;}
.carousel{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;padding:4px;}
.dot{width:6px;height:6px;border-radius:9999px;background:rgba(255,255,255,.5);}
.dot.active{background:#fff;}
.body{padding:16px;display:flex;flex-direction:column;gap:14px;}
.title{font:700 20px/32px var(--font-sans);letter-spacing:-.03em;color:var(--text-primary);margin:0;}
.meta{display:flex;align-items:center;gap:6px;font:400 14px/22px var(--font-sans);color:var(--neutral-700);}
.stars{display:inline-flex;gap:1.5px;align-items:center;}
.stars iconify-icon{font-size:18px;color:#f6c343;}
.stars iconify-icon.empty{color:var(--neutral-300);}
.rating{color:var(--neutral-950);font-weight:500;margin-left:4px;}
.actions{display:flex;gap:6px;}
.cta-primary{flex:1;height:40px;border:0;border-radius:8px;background:var(--primary-500);color:#fff;font:700 14px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
.cta-secondary{height:40px;padding:0 16px;border:1px solid var(--border-default);background:#fff;border-radius:8px;color:var(--text-primary);font:700 14px/1 var(--font-sans);display:flex;align-items:center;gap:8px;cursor:pointer;}
.desc{font:400 14px/22px var(--font-sans);color:var(--neutral-800);}
.desc-more{color:var(--text-primary);font-weight:700;text-decoration:underline;cursor:pointer;}
.info{display:flex;flex-direction:column;}
.info-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--border-subtle);}
.info-row iconify-icon.lead{font-size:20px;color:var(--neutral-800);flex-shrink:0;}
.info-row .lbl{flex:1;display:flex;flex-direction:column;}
.info-row .lbl span:first-child{font:400 13px/18px var(--font-sans);color:var(--neutral-700);}
.info-row .lbl span:last-child{font:600 14px/20px var(--font-sans);color:var(--text-primary);}
.info-row .copy{color:var(--neutral-700);font-size:16px;cursor:pointer;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<aside class="aside">
  <div class="cover">
    <div class="cover-bar">
      <button class="icon-btn"><iconify-icon icon="ph:arrow-left"></iconify-icon></button>
      <button class="icon-btn"><iconify-icon icon="ph:x"></iconify-icon></button>
    </div>
    <div class="carousel"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="body">
    <div>
      <h2 class="title">Sagrada Familia</h2>
      <div class="meta" style="margin-top:6px;">
        <span class="stars">
          <iconify-icon icon="ph:star-fill"></iconify-icon><iconify-icon icon="ph:star-fill"></iconify-icon><iconify-icon icon="ph:star-fill"></iconify-icon><iconify-icon icon="ph:star-fill"></iconify-icon><iconify-icon icon="ph:star-half-fill"></iconify-icon>
        </span>
        <span class="rating">4.8</span>
      </div>
    </div>
    <div class="actions">
      <button class="cta-primary"><iconify-icon icon="ph:plus"></iconify-icon>Añadir</button>
      <button class="cta-secondary"><iconify-icon icon="ph:navigation-arrow"></iconify-icon>Como llegar</button>
    </div>
    <p class="desc">Este animado albergue cuenta con instalaciones modernas y se encuentra a 3 minutos a pie de la estación de metro de Urgell. <span class="desc-more">Ver más</span></p>
    <div class="info">
      <div class="info-row"><iconify-icon icon="ph:map-pin" class="lead"></iconify-icon><div class="lbl"><span>Dirección</span><span>C/ de Mallorca, 401</span></div></div>
      <div class="info-row"><iconify-icon icon="ph:phone" class="lead"></iconify-icon><div class="lbl"><span>Teléfono</span><span>+34 932 080 414</span></div><iconify-icon icon="ph:copy" class="copy"></iconify-icon></div>
      <div class="info-row"><iconify-icon icon="ph:globe" class="lead"></iconify-icon><div class="lbl"><span>Página web</span><span>www.sagradafamilia.org</span></div><iconify-icon icon="ph:copy" class="copy"></iconify-icon></div>
    </div>
  </div>
</aside>
</body></html>
