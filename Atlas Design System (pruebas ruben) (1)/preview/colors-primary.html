<!doctype html>
<!-- @dsCard group="Colors" name="Primary · Eucalipto" subtitle="Brand primary scale (deep green) 25→950" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:20px;background:#fff;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.swatch{width:88px;}
.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}
.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}
.hex{font:400 10px/14px var(--font-mono);color:var(--text-secondary);font-family:ui-monospace,Menlo,monospace;}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--primary-25)"></div><div class="lbl">25</div><div class="hex">#e6f3ef</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-50)"></div><div class="lbl">50</div><div class="hex">#cce7df</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-100)"></div><div class="lbl">100</div><div class="hex">#99cfc0</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-200)"></div><div class="lbl">200</div><div class="hex">#66b7a0</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-300)"></div><div class="lbl">300</div><div class="hex">#339f80</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-400)"></div><div class="lbl">400</div><div class="hex">#00875a</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-500);outline:2px solid #00875a40;outline-offset:2px;"></div><div class="lbl">500 · base</div><div class="hex">#007a51</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-600)"></div><div class="lbl">600</div><div class="hex">#006d48</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-700)"></div><div class="lbl">700</div><div class="hex">#005f3f</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-800)"></div><div class="lbl">800</div><div class="hex">#00462e</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-900)"></div><div class="lbl">900</div><div class="hex">#003d29</div></div>
  <div class="swatch"><div class="chip" style="background:var(--primary-950)"></div><div class="lbl">950</div><div class="hex">#002e1f</div></div>
</div>
</body></html>
