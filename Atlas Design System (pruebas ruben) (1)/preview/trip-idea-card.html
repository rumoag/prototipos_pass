<!doctype html>
<!-- @dsCard group="Components" name="Trip Idea Card" subtitle="Cards de ideas de viaje con destinos y precio/persona" viewport="740x540" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:var(--neutral-25);font-family:var(--font-sans);display:flex;gap:24px;flex-wrap:wrap;}
.card{width:320px;background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border-subtle);}
.media{position:relative;aspect-ratio:var(--aspect-card);background:linear-gradient(135deg,#cce7df,#83b69a);}
.bookmark{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-700);box-shadow:var(--shadow-xs);}
.bookmark i{font-size:20px;}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;}
.title{font:700 18px/24px var(--font-sans);color:var(--text-primary);letter-spacing:-.01em;}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:9999px;background:var(--primary-50);color:var(--primary-800);font:600 11px/16px var(--font-sans);width:fit-content;}
.meta{display:flex;gap:14px;font:400 13px/18px var(--font-sans);color:var(--neutral-700);flex-wrap:wrap;}
.meta i{font-size:16px;margin-right:4px;vertical-align:-2px;}
.dest{font:400 14px/20px var(--font-sans);color:var(--neutral-700);}
.dest b{color:var(--text-primary);font-weight:500;}
.price{font:700 18px/24px var(--font-sans);color:var(--text-primary);}
.price small{font-weight:400;color:var(--neutral-700);font-size:14px;}
.cta{margin:0 16px 16px;height:var(--control-md);border:0;border-radius:8px;background:var(--primary-500);color:#fff;font:700 14px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;cursor:pointer;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>

<div class="card">
  <div class="media" style="background:linear-gradient(135deg,#ffdbc2,#ff8c47);"><div class="bookmark"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></div></div>
  <div class="body">
    <div class="title">Guatemala y El Salvador: Legado Maya</div>
    <span class="badge">Nuevo</span>
    <div class="meta"><span><iconify-icon icon="ph:airplane"></iconify-icon>3 transportes</span><span><iconify-icon icon="ph:moon"></iconify-icon>7 Noches</span><span><iconify-icon icon="ph:bed"></iconify-icon>2 Alojamientos</span></div>
    <div class="dest">Denpasar · Indonesia · Ubud · Nusa Penida · Uluwatu · Canggu · Denpasar</div>
    <div class="price">Desde 1.938 € <small>/ persona</small></div>
  </div>
  <button class="cta">Ver detalles</button>
</div>

<div class="card">
  <div class="media" style="background:linear-gradient(135deg,#dceaf6,#5d9bd0);"><div class="bookmark"><iconify-icon icon="ph:bookmark-simple"></iconify-icon></div></div>
  <div class="body">
    <div class="title">Luna de Miel en Guatemala</div>
    <div class="meta"><span><iconify-icon icon="ph:moon"></iconify-icon>7 Noches</span><span><iconify-icon icon="ph:bed"></iconify-icon>2 Alojamientos</span></div>
    <div class="dest">Denpasar · Indonesia · Ubud · Nusa Penida</div>
    <div class="price">Desde 2.305 € <small>/ persona</small></div>
  </div>
  <button class="cta">Ver detalles</button>
</div>

</body></html>
