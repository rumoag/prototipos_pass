<!doctype html>
<!-- @dsCard group="Components" name="Modal" subtitle="Modal / App + Modal / Web" viewport="1040x420" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:24px;background:var(--neutral-25);display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
/* Modal / App — narrower, with hero photo */
.modal{width:430px;border-radius:16px;background:#fff;box-shadow:var(--shadow-xl);overflow:hidden;display:flex;flex-direction:column;}
.head{padding:16px 16px 0;display:flex;justify-content:flex-end;}
.close{width:32px;height:32px;border-radius:9999px;border:var(--border-medium) solid var(--neutral-800);display:flex;align-items:center;justify-content:center;color:var(--neutral-800);cursor:pointer;background:#fff;}
.close i{font-size:14px;}
.hero{margin:8px 16px 0;height:128px;border-radius:12px;background:linear-gradient(135deg,#cce7df,#83b69a 60%,#398a5e);}
.body{padding:20px 16px 4px;text-align:left;}
.t{font:700 20px/24px var(--font-sans);color:#021f15;margin-bottom:8px;letter-spacing:-.01em;}
.d{font:400 16px/24px var(--font-sans);color:#021f15;letter-spacing:-.01em;}
.foot{padding:20px 16px;display:flex;justify-content:flex-end;}
.cta{height:48px;padding:0 24px;border-radius:8px;background:#1b352c;color:#fff;font:700 16px/20px var(--font-sans);letter-spacing:-.02em;border:0;cursor:pointer;}
.cta:hover{background:#0a1f17;}
/* Modal / Web — wider */
.modal.web{width:534px;}
.modal.web .hero{height:158px;}
</style><script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head><body>
<div class="modal">
  <div class="head"><div class="close"><iconify-icon icon="ph:x"></iconify-icon></div></div>
  <div class="hero"></div>
  <div class="body"><div class="t">Title</div><div class="d">Description</div></div>
  <div class="foot"><button class="cta">Button</button></div>
</div>
<div class="modal web">
  <div class="head"><div class="close"><iconify-icon icon="ph:x"></iconify-icon></div></div>
  <div class="hero"></div>
  <div class="body"><div class="t">Title</div><div class="d">Description</div></div>
  <div class="foot"><button class="cta">Button</button></div>
</div>
</body></html>
