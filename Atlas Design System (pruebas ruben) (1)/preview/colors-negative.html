<!doctype html>
<!-- @dsCard group="Colors" name="Feedback · Negative" subtitle="12 shades de Negative (#b92f12)" viewport="1200x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
body{margin:0;padding:20px;background:#fff;}
.title{font:700 14px/22px var(--font-sans);color:var(--text-primary);margin:0 0 4px;}
.sub{font:400 12px/16px var(--font-sans);color:var(--text-tertiary);margin:0 0 14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.swatch{width:88px;}
.chip{height:64px;border-radius:8px;border:1px solid rgba(0,0,0,.04);}
.lbl{margin-top:6px;font:600 11px/14px var(--font-sans);color:var(--text-primary);letter-spacing:.01em;}
.hex{font:400 10px/14px ui-monospace,Menlo,monospace;color:var(--text-secondary);}
</style></head>
<body>
<h2 class="title">Negative</h2>
<p class="sub">errors · destructive</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--negative-25);"></div><div class="lbl">25</div><div class="hex">#fdf3f1</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-50);"></div><div class="lbl">50</div><div class="hex">#fbe6e2</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-100);"></div><div class="lbl">100</div><div class="hex">#f7ccc4</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-200);"></div><div class="lbl">200</div><div class="hex">#efa599</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-300);"></div><div class="lbl">300</div><div class="hex">#e3806d</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-400);"></div><div class="lbl">400</div><div class="hex">#d35640</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-500);outline:2px solid #b92f1240;outline-offset:2px;"></div><div class="lbl">500 · base</div><div class="hex">#b92f12</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-600);"></div><div class="lbl">600</div><div class="hex">#94260e</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-700);"></div><div class="lbl">700</div><div class="hex">#6f1c0b</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-800);"></div><div class="lbl">800</div><div class="hex">#4a1307</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-900);"></div><div class="lbl">900</div><div class="hex">#250904</div></div>
  <div class="swatch"><div class="chip" style="background:var(--negative-950);"></div><div class="lbl">950</div><div class="hex">#130502</div></div>
</div>
</body></html>
